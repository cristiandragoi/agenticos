name: Hermes Runtime Repair

on:
  push:
    branches:
      - hermes-runtime-fix-20260908

permissions:
  contents: write

jobs:
  repair-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[hermes-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: hermes-runtime-fix-20260908
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Apply deterministic Hermes repair
        run: node scripts/apply-hermes-runtime-fix.cjs

      - name: Create portable backend TypeScript config
        run: |
          cat > server/tsconfig.hermes-ci.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "rootDir": "./src",
              "outDir": "./dist-hermes-ci"
            },
            "include": ["src/**/*.ts"],
            "exclude": ["src/__tests__/**/*"]
          }
          EOF

      - name: Compile backend
        run: npx tsc -p server/tsconfig.hermes-ci.json --noEmit

      - name: Run focused Hermes tests
        run: npx vitest run --config vitest.hermes.config.ts

      - name: Commit validated repair
        run: |
          git config user.name "agenticos-repair-bot"
          git config user.email "agenticos-repair-bot@users.noreply.github.com"
          git add server/src/services/agent/agentLoop.ts server/src/domains/hermes/service.ts server/src/__tests__/hermesExecutionMode.test.ts server/src/__tests__/hermesOperationalLoop.test.ts
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
            exit 0
          fi
          git commit -m "fix(hermes): enforce real tool execution contract [hermes-fixed]"
          git push origin HEAD:hermes-runtime-fix-20260908
